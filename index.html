<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nosso Cantinho ❤️</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

</head>


<body class="login-page">


    <main class="login-container">

        <div class="login-card">

            <div class="login-heart">
                ❤️
            </div>


            <h1>
                Nosso Cantinho
            </h1>


            <p class="login-subtitle">
                Esse lugar é só nosso...
            </p>


            <p class="login-text">
                Antes de entrar, você precisa descobrir
                a senha do nosso cantinho. ❤️
                Dica: O da do pedido de namoro!! 
            </p>


            <input
                type="password"
                id="senha"
                placeholder="Digite a senha..."
                maxlength="20"
            >


            <button onclick="entrar()">
                Entrar ❤️
            </button>


            <p id="mensagem-login"></p>

        </div>

    </main>


    <script>

        function entrar() {

            const senha =
                document.getElementById("senha").value;

            const mensagem =
                document.getElementById("mensagem-login");


            if (senha === "01022026") {

                mensagem.textContent =
                    "Acertou! Bem-vinda ao nosso cantinho, meu amor. ❤️";

                mensagem.className =
                    "login-sucesso";


                setTimeout(function() {

                    window.location.href = "home.html";

                }, 1500);


            } else {

                mensagem.textContent =
                    "Ta ERRADO. ";

                mensagem.className =
                    "login-erro";

            }

        }

    </script>


</body>

</html>
